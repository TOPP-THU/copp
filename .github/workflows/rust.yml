name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=generic"
  RUST_VERSION: 1.97.1
  RUST_MSRV: 1.88.0

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
          - platform: macos-aarch64
            os: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
          - platform: macos-x86_64
            os: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            macos_deployment_target: "10.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify runner architecture
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "${{ matrix.arch }}") {
            throw "Expected runner architecture ${{ matrix.arch }}, got ${{ runner.arch }}."
          }
          $hostTarget = ((rustc -vV | Select-String '^host:').Line -replace '^host:\s*', '')
          if ($hostTarget -ne "${{ matrix.target }}") {
            throw "Expected Rust host ${{ matrix.target }}, got $hostTarget."
          }

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-${{ matrix.platform }}

      - name: Run Rust tests
        run: cargo test --release --locked --all-targets

      - name: Run Rust doc tests
        run: cargo test --release --locked --doc

  msrv:
    name: Rust 1.88.0 MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: Set up Python for optional bindings
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-msrv-${{ env.RUST_MSRV }}

      - name: Check library and examples at MSRV
        run: cargo check --locked --all-features --lib --examples
