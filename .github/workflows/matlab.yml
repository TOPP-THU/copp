name: MATLAB Bindings

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    # Run on every push to any branch (no path filtering)
  pull_request:
    # Run on every pull request (no path filtering)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COPP_MATLAB_RELEASE: R2024b
  RUSTFLAGS: "-C target-cpu=generic"
  RUST_VERSION: 1.97.1

jobs:
  build:
    name: ${{ matrix.platform }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: X64
          - os: windows-2022
            platform: windows-x86_64
            arch: X64
          - os: macos-15
            platform: macos-aarch64
            arch: ARM64
            macos_deployment_target: "13.7"
          - os: macos-15-intel
            platform: macos-x86_64
            arch: X64
            macos_deployment_target: "13.7"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify runner architecture
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "${{ matrix.arch }}") {
            throw "Expected runner architecture ${{ matrix.arch }}, got ${{ runner.arch }}."
          }

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: matlab-${{ matrix.platform }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev

      - name: Build Rust MATLAB native library
        run: cargo build --release --locked --lib --features matlab

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ env.COPP_MATLAB_RELEASE }}

      # MATLAB on Linux needs the system libstdc++ preloaded. The paths are
      # Linux-only, and the existing LD_LIBRARY_PATH has to be expanded by the
      # shell: GitHub Actions does not expand variables inside an `env:` block.
      - name: Configure MATLAB library preload
        if: runner.os == 'Linux'
        run: |
          echo "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Build and test the MATLAB MEX gateway
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: |
            repo = string(pwd);
            matlabRoot = fullfile(repo, "bindings", "matlab");

            cd(matlabRoot);

            % Static linkage keeps the MEX gateway self-contained, which is what
            % lets the package job merge all four platforms into one toolbox.
            % A dynamic build would also ship libcopp.dylib for both macOS
            % architectures, and those two would collide under one name.
            build(Linkage="static", Configuration="release");

            addpath(matlabRoot);
            disp("Built COPP MATLAB package version: " + string(copp.version()));

            % run_tests() runs everything under bindings/matlab/tests and
            % asserts that none of them failed, so a failing test fails the job.
            run_tests();

      - name: Upload MEX gateway artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copp-matlab-mex-${{ matrix.platform }}
          path: bindings/matlab/+copp/+internal/copp_mex.mex*
          if-no-files-found: error

  package:
    name: Package universal toolbox
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # merge-multiple is safe here: every platform contributes exactly one
      # copp_mex file, and the four MATLAB extensions are all distinct.
      - name: Download MEX gateway artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: copp-matlab-mex-*
          merge-multiple: true
          path: mex-gateways

      - name: Prepare package metadata
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $refName = "pr-${{ github.event.pull_request.number }}"
          }

          $safeRefName = $refName -replace '[^A-Za-z0-9._-]', '-'
          $toolboxVersion = "0.0.1"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -match '^[0-9]+(\.[0-9]+){1,3}([+-].*)?$') {
              $toolboxVersion = ($tagVersion -split '[+-]')[0]
            }
          }

          "COPP_MATLAB_PACKAGE_NAME=copp-matlab-$safeRefName" >> $env:GITHUB_ENV
          "COPP_MATLAB_TOOLBOX_VERSION=$toolboxVersion" >> $env:GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ env.COPP_MATLAB_RELEASE }}

      # See the note in the build job: MATLAB on Linux needs the system
      # libstdc++ preloaded.
      - name: Configure MATLAB library preload
        run: |
          echo "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Package the universal MATLAB toolbox
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: |
            repo = string(pwd);
            matlabRoot = fullfile(repo, "bindings", "matlab");

            packageDir = "+copp";
            assert(isfolder(fullfile(matlabRoot, packageDir)), "COPP MATLAB package folder was not found.");

            toolboxName = "COPP for MATLAB";

            artifactRoot = fullfile(repo, "release-artifacts");
            stageRoot = fullfile(repo, "dist", getenv("COPP_MATLAB_PACKAGE_NAME"));
            if isfolder(artifactRoot)
                rmdir(artifactRoot, "s");
            end
            if isfolder(stageRoot)
                rmdir(stageRoot, "s");
            end
            mkdir(artifactRoot);
            mkdir(stageRoot);

            copyfile(fullfile(matlabRoot, packageDir), fullfile(stageRoot, packageDir));
            copyfile(fullfile(matlabRoot, "examples"), fullfile(stageRoot, "examples"));
            copyfile(fullfile(matlabRoot, "README.md"), fullfile(stageRoot, "MATLAB-README.md"));
            % The repository README stays out of the toolbox: it is the
            % Rust-facing overview, and every relative link in it dangles once
            % it is separated from the repository tree.
            for fileName = ["CHANGELOG.md", "LICENSE"]
                sourceFile = fullfile(repo, fileName);
                if isfile(sourceFile)
                    copyfile(sourceFile, fullfile(stageRoot, fileName));
                end
            end

            % Collect every platform's MEX gateway into a single package. A
            % missing platform has to fail the job here: the toolbox would still
            % package and install, and would only break at the first call on the
            % platform whose gateway went missing.
            internalDir = fullfile(stageRoot, packageDir, "+internal");
            gateways = dir(fullfile(repo, "mex-gateways", "copp_mex.mex*"));
            assert(~isempty(gateways), "No MEX gateways were downloaded from the build jobs.");
            gatewayNames = string({gateways.name});
            for extension = ["mexa64", "mexmaca64", "mexmaci64", "mexw64"]
                assert(any(gatewayNames == "copp_mex." + extension), ...
                    "No MEX gateway was downloaded for %s. Found: %s", ...
                    extension, strjoin(gatewayNames, ", "));
            end
            assert(numel(gateways) == 4, ...
                "Expected exactly 4 MEX gateways, found %d: %s", ...
                numel(gateways), strjoin(gatewayNames, ", "));
            for i = 1:numel(gateways)
                copyfile(fullfile(gateways(i).folder, gateways(i).name), internalDir);
            end

            toolboxId = "0d55637d-8f40-49b9-9d1a-7cad2cf11bd1";
            toolboxVersion = string(getenv("COPP_MATLAB_TOOLBOX_VERSION"));
            outputFile = fullfile(artifactRoot, string(getenv("COPP_MATLAB_PACKAGE_NAME")) + ".mltbx");

            previousDir = pwd;
            cd(stageRoot);
            opts = matlab.addons.toolbox.ToolboxOptions(stageRoot, toolboxId);
            opts.ToolboxName = toolboxName;
            opts.ToolboxVersion = toolboxVersion;
            opts.Summary = "MATLAB bindings for COPP.";
            opts.Description = "MATLAB package wrapping the COPP native solver core through a MEX gateway.";
            opts.AuthorName = "TOPP-THU";
            opts.AuthorEmail = "hello@copp.pro";
            opts.ToolboxMatlabPath = {"."};
            opts.OutputFile = outputFile;
            opts.MinimumMatlabRelease = string(getenv("COPP_MATLAB_RELEASE"));
            opts.MaximumMatlabRelease = "";
            opts.SupportedPlatforms.Win64 = true;
            opts.SupportedPlatforms.Mac = true;
            opts.SupportedPlatforms.Glnxa64 = true;
            opts.SupportedPlatforms.MatlabOnline = false;

            matlab.addons.toolbox.packageToolbox(opts);
            cd(previousDir);

      - name: Generate SHA256
        shell: pwsh
        run: |
          $toolbox = Get-ChildItem -Path release-artifacts -Filter "*.mltbx" | Select-Object -First 1
          if (-not $toolbox) {
            throw "No MATLAB toolbox was generated."
          }

          $hash = Get-FileHash $toolbox.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($toolbox.Name)" |
            Set-Content -Path "$($toolbox.FullName).sha256" -NoNewline

      # Must run after "Generate SHA256", which selects the single .mltbx by wildcard.
      # The stable name lets install_copp() resolve the newest release from
      # /releases/latest/download/ without calling api.github.com. The tagged asset
      # remains the immutable copy; this one is overwritten by every release.
      - name: Add stable-name toolbox copy
        shell: pwsh
        run: |
          $taggedName = "$env:COPP_MATLAB_PACKAGE_NAME.mltbx"
          $taggedPath = Join-Path "release-artifacts" $taggedName
          if (-not (Test-Path -LiteralPath $taggedPath)) {
            throw "Expected MATLAB toolbox was not found: $taggedPath"
          }

          $stableName = "copp-matlab.mltbx"
          $stablePath = Join-Path "release-artifacts" $stableName
          Copy-Item -LiteralPath $taggedPath -Destination $stablePath -Force

          $hash = Get-FileHash -LiteralPath $stablePath -Algorithm SHA256
          "$($hash.Hash.ToLower())  $stableName" |
            Set-Content -Path "$stablePath.sha256" -NoNewline

      - name: Upload MATLAB toolbox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copp-matlab-toolbox
          path: |
            release-artifacts/*.mltbx
            release-artifacts/*.mltbx.sha256
          if-no-files-found: error

  verify:
    name: ${{ matrix.platform }} install check
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download MATLAB toolbox artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copp-matlab-toolbox
          path: release-artifacts

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ env.COPP_MATLAB_RELEASE }}

      # See the note in the build job: MATLAB on Linux needs the system
      # libstdc++ preloaded.
      - name: Configure MATLAB library preload
        if: runner.os == 'Linux'
        run: |
          echo "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      # The only place the shipped artifact is exercised end to end. This
      # platform's MEX gateway was built on a different runner and merged
      # elsewhere, so a merge that dropped or corrupted it only surfaces here.
      - name: Install the universal toolbox and smoke test it
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: |
            repo = string(pwd);
            matlabRoot = fullfile(repo, "bindings", "matlab");
            artifactRoot = fullfile(repo, "release-artifacts");

            % Run the installer from a copy so the checkout never puts its own
            % +copp on the MATLAB path: the version install_copp() reports has
            % to come from the installed toolbox.
            installerRoot = string(tempname);
            mkdir(installerRoot);
            copyfile(fullfile(matlabRoot, "install_copp.m"), installerRoot);
            addpath(installerRoot);

            installed = install_copp( ...
                AssetRoot=artifactRoot, ...
                Version="latest", ...
                Package="copp", ...
                AgreeToLicense=true);
            disp(installed);

  publish-draft:
    name: Attach MATLAB Toolbox to Draft Release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Download MATLAB toolbox artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copp-matlab-toolbox
          path: release-assets

      - name: Wait for draft release and upload the MATLAB toolbox
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assetPaths = @(
            Get-ChildItem release-assets -Recurse -File |
              Where-Object { $_.Name -like "*.mltbx" -or $_.Name -like "*.mltbx.sha256" } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assetPaths.Count -eq 0) {
            throw "No release assets were downloaded."
          }

          $deadline = (Get-Date).AddMinutes(30)
          while ($true) {
            $isDraft = & gh release view $env:RELEASE_TAG --json isDraft --jq ".isDraft" 2>$null
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ((Get-Date) -ge $deadline) {
              throw "Timed out waiting for the C ABI workflow to create draft release $env:RELEASE_TAG."
            }
            Start-Sleep -Seconds 10
          }

          if (("$isDraft").Trim() -ne "true") {
            throw "Release $env:RELEASE_TAG is already published; refusing to overwrite its assets."
          }

          & gh release upload $env:RELEASE_TAG @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the MATLAB toolbox to $env:RELEASE_TAG."
          }
