name: Python

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=generic"
  MATURIN_VERSION: v1.14.1
  RUST_VERSION: 1.97.1

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          command: sdist
          args: --locked --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels-linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The manylinux container ships every supported interpreter, so a single
      # maturin invocation covers 3.9-3.14 instead of one job per version.
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          command: build
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: >-
            --release
            --locked
            --features python
            --out dist
            --compatibility pypi
            --auditwheel repair
            --strip
            -i python3.9
            -i python3.10
            -i python3.11
            -i python3.12
            -i python3.13
            -i python3.14

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  build-wheels-native:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-x86_64
            os: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            extra-args: ""
          - name: macos-aarch64
            os: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            extra-args: ""
          - name: windows-x86_64
            os: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
            extra-args: "--compatibility pypi --auditwheel repair"
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify runner architecture
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "${{ matrix.platform.arch }}") {
            throw "Expected runner architecture ${{ matrix.platform.arch }}, got ${{ runner.arch }}."
          }

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          command: build
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --locked
            --features python
            --out dist
            --strip
            -i python
            ${{ matrix.platform.extra-args }}

      # Native runners can exercise the wheel they just produced, so these
      # platforms need no separate download-and-test job.
      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install --no-index --find-links dist --no-deps --force-reinstall copp-py

      - name: Run Python tests
        run: python -m pytest bindings/python/tests

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  test-linux:
    name: test linux-${{ matrix.arch }} / Python ${{ matrix.python-version }}
    needs: build-wheels-linux
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install --no-index --find-links dist --no-deps --force-reinstall copp-py

      - name: Run Python tests
        run: python -m pytest bindings/python/tests

  check-version:
    name: Check version matches tag
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag against pyproject.toml
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $match = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $match) {
            throw "Could not read version from pyproject.toml."
          }
          $projectVersion = $match.Matches[0].Groups[1].Value
          if ($tagVersion -ne $projectVersion) {
            throw "Tag $env:RELEASE_TAG does not match pyproject.toml version $projectVersion."
          }
          Write-Host "Tag $env:RELEASE_TAG matches pyproject.toml version $projectVersion."

  publish-draft:
    name: Attach Python Distributions to Draft Release
    needs:
      - check-version
      - build-sdist
      - build-wheels-linux
      - build-wheels-native
      - test-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Wait for draft release and upload Python distributions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assetPaths = @(
            Get-ChildItem release-assets -Recurse -File |
              Where-Object { $_.Name -like "*.whl" -or $_.Name -like "*.tar.gz" } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assetPaths.Count -eq 0) {
            throw "No Python distributions were downloaded."
          }

          $deadline = (Get-Date).AddMinutes(30)
          while ($true) {
            $isDraft = & gh release view $env:RELEASE_TAG --json isDraft --jq ".isDraft" 2>$null
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ((Get-Date) -ge $deadline) {
              throw "Timed out waiting for the C ABI workflow to create draft release $env:RELEASE_TAG."
            }
            Start-Sleep -Seconds 10
          }

          if (("$isDraft").Trim() -ne "true") {
            throw "Release $env:RELEASE_TAG is already published; refusing to overwrite its assets."
          }

          & gh release upload $env:RELEASE_TAG @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload Python distributions to $env:RELEASE_TAG."
          }

  publish-pypi:
    name: Publish to PyPI
    needs:
      - check-version
      - build-sdist
      - build-wheels-linux
      - build-wheels-native
      - test-linux
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
