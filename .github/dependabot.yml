version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    # Version-update PRs are off: actions are pinned by SHA and updated by
    # hand. Set this above zero to resume them.
    open-pull-requests-limit: 0
